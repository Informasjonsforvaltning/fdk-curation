---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fdk-curation
  labels:
    fdk.service: fdk-curation
spec:
  replicas: 1
  selector:
    matchLabels:
      fdk.service: fdk-curation
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        fdk.service: fdk-curation
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fdk-curation
          image: fdk-curation
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: conf
              mountPath: /etc/nginx/conf.d
          env:
            - name: CURATION_VERSION
              value: $(GIT_COMMIT_SHA)
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "32Mi"
              cpu: "5m"
            limits:
              memory: "64Mi"
          livenessProbe:
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
        - name: conf
          emptyDir: {}
      restartPolicy: Always
